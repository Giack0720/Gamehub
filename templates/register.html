
<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registrazione - GameHub</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <div class="logo">
                🎮 GAMEHUB
            </div>

            <h2>Crea il tuo account</h2>

            <p>Entra nella community GameHub</p>

            {% with messages = get_flashed_messages() %}
                {% for message in messages %}
                    <div class="message">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Nome utente"
                    required
                >

                <input
                    type="email"
                    name="email"
                    placeholder="Indirizzo email"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password (minimo 8 caratteri)"
                    minlength="8"
                    required
                >

                <button type="submit">
                    Registrati
                </button>

            </form>

            <p>
                Hai già un account?
                <a href="{{ url_for('login') }}">
                    Accedi
                </a>
            </p>

            <a href="{{ url_for('home') }}" class="back-link">
                Torna alla homepage
            </a>

        </div>

    </div>

</body>
</html>
